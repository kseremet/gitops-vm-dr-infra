parameters:
- name: VM_PASSWORD
  displayName: VM User Password
  description: "Password for the 'fedora' user"
  value: "openshift"
  required: true
- name: DATA_SOURCE_NAME
  displayName: OS Image Source
  description: "Name of the DataSource to clone (e.g. fedora)"
  value: fedora
  required: true
- name: DATA_SOURCE_NAMESPACE
  displayName: OS Image Namespace
  description: "Namespace of the DataSource (e.g. openshift-virtualization-os-images)"
  value: openshift-virtualization-os-images
  required: true