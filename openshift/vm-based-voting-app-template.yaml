# ==============================================================================
# 3. VIRTUAL MACHINES
# ==============================================================================

- apiVersion: kubevirt.io/v1
  kind: VirtualMachine
  metadata:
    name: voting-redis
    labels:
      app: voting-app
      tier: backend
      role: queue
      dr.demojam.com/enabled: 'true'
      vm.kubevirt.io/name: voting-redis
  spec:
    runStrategy: Always
    template:
      metadata:
        labels:
          app: voting-app
          tier: backend
          role: queue
          vm.kubevirt.io/name: voting-redis
      spec:
        domain:
          devices:
            disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
            interfaces:
            - name: default
              masquerade: {}
              model: virtio
          resources:
            requests:
              memory: 1Gi
        networks:
        - name: default
          pod: {}
        volumes:
        - name: rootdisk
          dataVolume:
            name: voting-redis-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: voting-redis-userdata
    dataVolumeTemplates:
    - metadata:
        name: voting-redis-root
      spec:
        sourceRef:
          kind: DataSource
          name: ${DATA_SOURCE_NAME}
          namespace: ${DATA_SOURCE_NAMESPACE}
        storage:
          resources:
            requests:
              storage: 30Gi

- apiVersion: kubevirt.io/v1
  kind: VirtualMachine
  metadata:
    name: voting-db
    labels:
      app: voting-app
      tier: backend
      role: database
      dr.demojam.com/enabled: 'true'
      vm.kubevirt.io/name: voting-db
  spec:
    runStrategy: Always
    template:
      metadata:
        labels:
          app: voting-app
          tier: backend
          role: database
          vm.kubevirt.io/name: voting-db
      spec:
        domain:
          devices:
            disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
            - name: data-disk
              serial: "DBDATA"
              disk:
                bus: virtio
            interfaces:
            - name: default
              masquerade: {}
              model: virtio
          resources:
            requests:
              memory: 1.5Gi
        networks:
        - name: default
          pod: {}
        volumes:
        - name: rootdisk
          dataVolume:
            name: voting-db-root
        - name: data-disk
          dataVolume:
            name: voting-db-data
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: voting-db-userdata
    dataVolumeTemplates:
    - metadata:
        name: voting-db-root
      spec:
        sourceRef:
          kind: DataSource
          name: ${DATA_SOURCE_NAME}
          namespace: ${DATA_SOURCE_NAMESPACE}
        storage:
          resources:
            requests:
              storage: 30Gi
    - metadata:
        name: voting-db-data
      spec:
        source:
          blank: {}
        storage:
          volumeMode: Block
          accessModes:
          - ReadWriteMany
          resources:
            requests:
              storage: 5Gi

