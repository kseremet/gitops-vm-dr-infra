---
- name: "Create Credential Types on Controller"
  include_role:
    name: infra.aap_configuration.controller_credential_types
  vars:
    aap_hostname: "{{ controller_hostname }}"
    aap_username: "{{ controller_username }}"
    aap_password: "{{ controller_password }}"
    aap_validate_certs: "{{ controller_validate_certs }}"

- name: "Create Credential Types on EDA"
  include_role:
    name: infra.aap_configuration.eda_credential_types
  vars:
    # Reusing the same credentials/host as per unified platform architecture
    aap_hostname: "{{ eda_hostname }}"
    aap_username: "{{ eda_username }}"
    aap_password: "{{ eda_password }}"
    aap_validate_certs: "{{ eda_validate_certs }}"
    eda_configuration_credential_types_secure_logging: false

