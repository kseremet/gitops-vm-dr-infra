---
# We construct the credentials list using the facts set in the previous task.
# This assumes cls1_url, cls1_token, etc. are available.

- name: "Construct Credentials List"
  set_fact:
    controller_credentials:
      - name: "cls1-admin"
        description: "Admin Service Account Credential for Cluster 1"
        organization: "Default"
        credential_type: "OpenShift Bearer Token"
        inputs:
          host: "{{ cls1_url }}"
          bearer_token: "{{ cls1_token }}"
          verify_ssl: false
      
      - name: "cls2-admin"
        description: "Admin Service Account Credential for Cluster 2"
        organization: "Default"
        credential_type: "OpenShift Bearer Token"
        inputs:
          host: "{{ cls2_url }}"
          bearer_token: "{{ cls2_token }}"
          verify_ssl: false

- name: "Create Credentials on Controller"
  include_role:
    name: infra.aap_configuration.controller_credentials
  vars:
    aap_hostname: "{{ controller_hostname }}"
    aap_username: "{{ controller_username }}"
    aap_password: "{{ controller_password }}"
    aap_validate_certs: "{{ controller_validate_certs }}"
    # controller_credentials is passed implicitly from set_fact above

- name: "Create Credentials on EDA"
  include_role:
    name: infra.aap_configuration.eda_credentials
  vars:
    aap_hostname: "{{ eda_hostname }}"
    aap_username: "{{ eda_username }}"
    aap_password: "{{ eda_password }}"
    aap_validate_certs: "{{ eda_validate_certs }}"
    eda_credentials: "{{ controller_credentials }}"
