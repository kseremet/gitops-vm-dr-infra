---
# This task file runs inside a loop for each 'cluster_item' (cls1, cls2)

- name: "Get Cluster API URL from Kubeconfig for {{ cluster_item.name }}"
  set_fact:
    # Extract the server URL directly from the yaml file
    _cluster_url: "{{ (lookup('file', './kubeconfig_' + cluster_item.name) | from_yaml).clusters[0].cluster.server }}"

- name: "Create ServiceAccount 'ansible' in default namespace on {{ cluster_item.name }}"
  kubernetes.core.k8s:
    kubeconfig: "./kubeconfig_{{ cluster_item.name }}"
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: ansible
        namespace: default

- name: "Bind cluster-admin role to 'ansible' SA on {{ cluster_item.name }}"
  kubernetes.core.k8s:
    kubeconfig: "./kubeconfig_{{ cluster_item.name }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: ansible-cluster-admin
      subjects:
        - kind: ServiceAccount
          name: ansible
          namespace: default
      roleRef:
        kind: ClusterRole
        name: cluster-admin
        apiGroup: rbac.authorization.k8s.io

- name: "Create Long-Lived Token Secret for 'ansible' SA on {{ cluster_item.name }}"
  kubernetes.core.k8s:
    kubeconfig: "./kubeconfig_{{ cluster_item.name }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/service-account-token
      metadata:
        name: ansible-token
        namespace: default
        annotations:
          kubernetes.io/service-account.name: ansible

- name: "Wait for Token to be populated on {{ cluster_item.name }}"
  kubernetes.core.k8s_info:
    kubeconfig: "./kubeconfig_{{ cluster_item.name }}"
    kind: Secret
    name: ansible-token
    namespace: default
  register: sa_token_secret
  until:
    - sa_token_secret.resources | length > 0
    - sa_token_secret.resources[0].data.token is defined
  retries: 20
  delay: 2

- name: "Set Credentials Facts for {{ cluster_item.name }}"
  set_fact:
    # Dynamic variables like 'cls1_token', 'cls1_url', 'cls1_ca_cert'
    "{{ cluster_item.name }}_url": "{{ _cluster_url }}"
    "{{ cluster_item.name }}_token": "{{ sa_token_secret.resources[0].data.token | b64decode }}"
    "{{ cluster_item.name }}_ca_cert": "{{ sa_token_secret.resources[0].data['ca.crt'] | b64decode }}"

