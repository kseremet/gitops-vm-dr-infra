---
# We'll use the keypair generated for 'cls1' as the shared GitOps key.
# File path: /tmp/ssh_key_cls1
# Private key for the credential, Public key to display to the user.

- name: "Read SSH Private Key for GitOps"
  set_fact:
    gitops_private_key: "{{ lookup('file', '/tmp/ssh_key_cls1') }}"
    gitops_public_key: "{{ lookup('file', '/tmp/ssh_key_cls1.pub') }}"

- name: "Define SSH Machine Credential"
  set_fact:
    ssh_credential_def:
      - name: "ssh-key"
        description: "GitOps Repository SSH Key"
        organization: "Default"
        credential_type: "Machine"
        inputs:
          # Machine credentials take 'ssh_key_data' for the private key
          ssh_key_data: "{{ gitops_private_key }}"
          username: "git" # Standard for git interactions

- name: "Create SSH Machine Credential on Controller"
  include_role:
    name: infra.aap_configuration.controller_credentials
  vars:
    aap_hostname: "{{ controller_hostname }}"
    aap_username: "{{ controller_username }}"
    aap_password: "{{ controller_password }}"
    aap_validate_certs: "{{ controller_validate_certs }}"
    controller_credentials: "{{ ssh_credential_def }}"

