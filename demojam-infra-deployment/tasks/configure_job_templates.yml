---
# We need an Inventory for the Job Template to bind to, even if it's localhost/empty.
- name: "Ensure Demo Inventory Exists"
  include_role:
    name: infra.aap_configuration.controller_inventories
  vars:
    aap_hostname: "{{ controller_hostname }}"
    aap_username: "{{ controller_username }}"
    aap_password: "{{ controller_password }}"
    aap_validate_certs: "{{ controller_validate_certs }}"
    controller_inventories:
      - name: "Demo Inventory"
        organization: "Default"

- name: "Create Job Templates on Controller"
  include_role:
    name: infra.aap_configuration.controller_job_templates
  vars:
    aap_hostname: "{{ controller_hostname }}"
    aap_username: "{{ controller_username }}"
    aap_password: "{{ controller_password }}"
    aap_validate_certs: "{{ controller_validate_certs }}"
    # controller_templates is passed implicitly from vars file

- name: "Create Workflow Job Templates on Controller"
  include_role:
    name: infra.aap_configuration.controller_workflow_job_templates
  when: controller_workflows is defined
  vars:
    aap_hostname: "{{ controller_hostname }}"
    aap_username: "{{ controller_username }}"
    aap_password: "{{ controller_password }}"
    aap_validate_certs: "{{ controller_validate_certs }}"

