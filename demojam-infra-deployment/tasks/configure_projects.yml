---
# --- Controller (Standard Role) ---
- name: "Create Projects on Controller"
  include_role:
    name: infra.aap_configuration.controller_projects
  vars:
    aap_hostname: "{{ controller_hostname }}"
    aap_username: "{{ controller_username }}"
    aap_password: "{{ controller_password }}"
    aap_validate_certs: "{{ controller_validate_certs }}"
    # controller_projects is passed implicitly

# --- EDA (Standard Role) ---
- name: "Create Projects on EDA"
  include_role:
    name: infra.aap_configuration.eda_projects
  vars:
    aap_hostname: "{{ eda_hostname }}"
    aap_username: "{{ eda_username }}"
    aap_password: "{{ eda_password }}"
    aap_validate_certs: "{{ eda_validate_certs }}"
    # Map the controller variable to the expected EDA variable name
    eda_projects: "{{ controller_projects }}"
  when: eda_hostname | length > 0
