---
# --- Controller Credential Types (uses tower.filename) ---
controller_credential_types:
  - name: "OpenShift Bearer Token"
    description: "Custom OpenShift Credential Type"
    kind: "cloud"
    inputs:
      fields:
        - id: host
          type: string
          label: OpenShift or Kubernetes API Endpoint
          help_text: The OpenShift or Kubernetes API Endpoint to authenticate with.
        - id: bearer_token
          type: string
          label: API authentication bearer token
          secret: true
        - id: verify_ssl
          type: boolean
          label: Verify SSL
          default: false
      required:
        - host
        - bearer_token
    injectors:
      env:
        K8S_AUTH_HOST: !unsafe '{{ host }}'
        K8S_AUTH_API_KEY: !unsafe '{{ bearer_token }}'
        K8S_AUTH_VERIFY_SSL: !unsafe '{{ verify_ssl }}'

